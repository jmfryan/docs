name: Notify Intercom internal-agent on push to main

# Runs on every push to `main` (typically a PR landing) and POSTs the
# head commit's metadata, full message, and diff to Intercom's
# internal-agent external-trigger endpoint, asking it to scan
# help-center articles and procedures for content that may need
# updating.
#
# Required repo secrets:
#   INTERCOM_TOKEN     — Intercom access token with `manage_internal_agent_chats`
#                        scope (see Settings → Secrets → Actions).
#
# Optional repo secrets / variables:
#   INTERCOM_API_BASE  — Base URL for the Intercom API. Defaults to
#                        `https://api.intercom.io`. Override for staging.
#   INTERCOM_VERSION   — Intercom-Version header. Defaults to `2.13`.
#   INTERCOM_APP_ID    — Intercom workspace id_code (e.g. `tx2p130c`). When
#                        set, the workflow logs a clickable link to the chat
#                        for click-through from the GitHub run page.
#   INTERCOM_APP_HOST  — Base URL of the Intercom admin app. Defaults to
#                        `https://app.intercom.com`. Override for staging.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build trigger payload
        id: payload
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_AUTHOR_LOGIN: ${{ github.event.head_commit.author.username }}
          COMMIT_AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Use jq to safely JSON-encode all string fields (handles quotes,
          # newlines, control chars, etc. without manual escaping).
          #
          # The payload combines a short visible `summary` text with two of
          # internal-agent's structured message-part types:
          #
          #   summary              — short visible text rendered as the user's
          #                          first chat bubble. Frames what the agent
          #                          is being asked to do for anyone reading
          #                          the conversation.
          #   hidden_instructions  — steering text fed to the model only; never
          #                          shown in the chat bubble. Used here to give
          #                          the agent its task without polluting the UI.
          #   external_references  — a clickable chip rendered above the bubble,
          #                          with an optional embedded `content` payload
          #                          that reaches the model but stays hidden in
          #                          the UI. Used here to attach the head commit
          #                          (chip shows subject + short SHA/author/repo,
          #                          content carries the full message + diff).
          #
          # title and subtitle are capped at 200 bytes by internal-agent;
          # content is capped at 50_000. We byte-truncate the combined
          # message+diff to 49_000 then run iconv -c to repair any UTF-8
          # boundary breakage caused by head -c cutting mid-codepoint.

          AFTER_SHORT="${AFTER_SHA:0:7}"

          # Pick a display name: prefer GitHub login (renders as @handle),
          # fall back to the commit author's name (no @).
          if [ -n "$COMMIT_AUTHOR_LOGIN" ]; then
            AUTHOR_DISPLAY="@${COMMIT_AUTHOR_LOGIN}"
          else
            AUTHOR_DISPLAY="${COMMIT_AUTHOR_NAME}"
          fi

          COMMIT_SUBJECT=$(git log -1 --pretty=%s "$AFTER_SHA")
          COMMIT_MESSAGE=$(git log -1 --pretty=%B "$AFTER_SHA")

          # Diff for everything pushed in this event. The initial push to a
          # branch sets `before` to forty zeros — there is no parent to diff
          # against, so fall back to showing the head commit alone.
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            DIFF=$(git show --no-color --format= "$AFTER_SHA")
          else
            DIFF=$(git diff --no-color "$BEFORE_SHA" "$AFTER_SHA")
          fi

          CONTENT=$(printf '%s\n\n```diff\n%s\n```\n' "$COMMIT_MESSAGE" "$DIFF" \
            | head -c 49000 \
            | iconv -f UTF-8 -t UTF-8 -c)

          jq -n \
            --arg agent_mode "content-configuration-agent" \
            --arg summary "A new commit has landed on \`${BRANCH}\`. Can you please check which docs need updating?" \
            --arg prompt "A code change just landed. Find content in THIS WORKSPACE that may be affected and propose concrete edits to it directly. STEP 1 — Load the content-management skill before doing anything else: call the \`load_skill\` tool with skill name \`content-management\`. That skill teaches you how to find, read, and edit this workspace's content correctly; do not skip it. STEP 2 — Search THIS WORKSPACE'S own content. USE the tool named \`search_knowledge_hub_content\` (or, if that isn't registered in this workspace, the tool named \`search\`). Either one returns this workspace's help-center articles, snippets, internal articles, and procedures — exactly the content we want to update. DO NOT USE the tool named \`search_intercom_content\`. Despite the name, \`search_intercom_content\` searches Intercom's own help center (workspace 6), NOT this workspace; its results are irrelevant for this task. Even if the name looks like what you want, do not call it — not once. If you find yourself reaching for \`search_intercom_content\`, stop and call \`search_knowledge_hub_content\` (or \`search\`) instead. STEP 3 — Propose concrete edits directly. Do NOT ask for confirmation, do NOT ask clarifying questions, and do NOT wait for approval — produce the proposed updates in this same response. This trigger comes from a GitHub Action with no human in the loop to answer follow-up questions, so any hesitation or request for confirmation is a failure mode." \
            --arg subject "$COMMIT_SUBJECT" \
            --arg subtitle "commit ${AFTER_SHORT} · ${AUTHOR_DISPLAY} · ${REPO}" \
            --arg commit_url "$COMMIT_URL" \
            --arg content "$CONTENT" \
            --arg sha "$AFTER_SHA" \
            --arg branch "$BRANCH" \
            --arg author_login "$COMMIT_AUTHOR_LOGIN" \
            --arg author_name "$COMMIT_AUTHOR_NAME" \
            --arg repo "$REPO" \
            '{
              agent_mode: $agent_mode,
              summary: $summary,
              hidden_instructions: $prompt,
              external_references: [
                {
                  title: ($subject | .[0:200]),
                  subtitle: ($subtitle | .[0:200]),
                  iconKind: "github",
                  url: $commit_url,
                  content: $content
                }
              ],
              metadata: {
                trigger_source: "github_action",
                github_event: "push",
                github_repository: $repo,
                github_branch: $branch,
                github_commit_sha: $sha,
                github_commit_author_login: $author_login,
                github_commit_author_name: $author_name
              }
            }' > payload.json
          echo "payload size: $(wc -c < payload.json) bytes"

      - name: POST to Intercom internal-agent
        id: dispatch
        env:
          INTERCOM_TOKEN: ${{ secrets.INTERCOM_TOKEN }}
          INTERCOM_API_BASE: ${{ secrets.INTERCOM_API_BASE || vars.INTERCOM_API_BASE || 'https://api.intercom.io' }}
          INTERCOM_VERSION: ${{ secrets.INTERCOM_VERSION || vars.INTERCOM_VERSION || '2.13' }}
          INTERCOM_APP_ID: ${{ secrets.INTERCOM_APP_ID || vars.INTERCOM_APP_ID }}
          INTERCOM_APP_HOST: ${{ secrets.INTERCOM_APP_HOST || vars.INTERCOM_APP_HOST || 'https://app.intercom.com' }}
        run: |
          if [ -z "$INTERCOM_TOKEN" ]; then
            echo "::error::INTERCOM_TOKEN secret is not configured on this repo"
            exit 1
          fi

          response_file=$(mktemp)
          status=$(curl -sS -o "$response_file" -w "%{http_code}" \
            -X POST "${INTERCOM_API_BASE}/internal_agent/chats" \
            -H "Authorization: Bearer ${INTERCOM_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Intercom-Version: ${INTERCOM_VERSION}" \
            --data @payload.json)

          echo "HTTP $status"
          cat "$response_file"
          echo

          # Treat 2xx as success
          case "$status" in
            2*) ;;
            *)  echo "::error::Intercom returned HTTP $status"; exit 1 ;;
          esac

          chat_id=$(jq -r '.chat_id // empty' < "$response_file")

          # Build the click-through URL when we know the workspace id.
          # Without INTERCOM_APP_ID we can't construct it (the API doesn't
          # return one), so fall back to just surfacing the chat_id.
          if [ -n "$chat_id" ] && [ -n "$INTERCOM_APP_ID" ]; then
            chat_url="${INTERCOM_APP_HOST%/}/a/apps/${INTERCOM_APP_ID}/internal-agent/chats/${chat_id}"
            echo "::notice::Intercom chat dispatched: ${chat_url}"
            {
              echo "### Intercom internal-agent chat dispatched"
              echo
              echo "[View chat in Intercom](${chat_url})"
              echo
              echo "- chat_id: \`${chat_id}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "chat_url=${chat_url}" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Intercom chat dispatched (${chat_id})"
            {
              echo "### Intercom internal-agent chat dispatched"
              echo
              echo "- chat_id: \`${chat_id}\`"
              if [ -z "$INTERCOM_APP_ID" ]; then
                echo "- _Set the \`INTERCOM_APP_ID\` repo variable to get a clickable chat link here._"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "chat_id=${chat_id}" >> "$GITHUB_OUTPUT"
